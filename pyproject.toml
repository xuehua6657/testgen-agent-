[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testgen-agent"
version = "0.1.0"
description = "AI-powered automated test generation from code changes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "TestGen Team"}
]
keywords = ["testing", "agent", "ai", "code-generation", "pytest", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "openai>=1.0,<3.0",
    "pydantic>=2.0,<3.0",
    "langgraph>=0.2,<1.0",
    "typer>=0.12,<1.0",
    "pyyaml>=6.0,<7.0",
    "rich>=13.0,<14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "build>=1.0",
]

[project.scripts]
testgen = "testgen.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
